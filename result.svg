<!DOCTYPE html>
<html>
<head>
<style>
body{
	margin: 0;
	padding: 0;
}
.dbutton{
		height: 8vh;
		vertical-align: middle;
}
.menus{
	width: 100%;
	height: 9vh;
	padding: 0;
	border: thin solid black;
	border-radius: 1vw;
}
#svg{
	float: right;
};
.panel{
	width: 49vw;
	height: 90vh;
	float: left;
	margin: 0;
	padding-left: 0.5vw;
	border: solid thin black;
	border-radius: 1vh;
}
.panel25{
	width: 24vw;
	height: 90vh;
	float: left;
	margin: 0;
	padding-left: 0.5vw;
	border: solid thin black;
	border-radius: 1vh;
}
.panel75{
	width: 74vw;
	height: 90vh;
	float: left;
	margin: 0;
	padding-left: 0.5vw;
	border: solid thin black;
	border-radius: 1%;
}
svg{
	width: 95%;
	height: 95%;
}
</style>
<script>
	const cboxes = [];
